name: CI

on:
  push:
    branches: [main]
  pull_request:

# Strategy: each natively-supported platform/ABI has its own runner that
# does `zig build test` (native build + native smoke run). Targets without
# a matching runner (wasm, ARM Windows) are cross-compiled on Linux as a
# build-only check.

jobs:
  native:
    name: native ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: linux-x86_64,         target: x86_64-linux-gnu,     extra: "",            run_smoke: true,  run_test_all: true  }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,        target: aarch64-linux-gnu,    extra: "",            run_smoke: true,  run_test_all: true  }
          - { os: macos-latest,     label: macos-aarch64,        target: aarch64-macos,        extra: "",            run_smoke: true,  run_test_all: true  }
          # macos-13 (x86_64) is paused: GitHub-hosted macos-13 runners are
          # heavily oversubscribed and our jobs sit in `queued` for hours.
          # Re-enable once availability improves, or move to a self-hosted
          # Intel Mac.
          # - { os: macos-13,         label: macos-x86_64,         target: x86_64-macos,         extra: ""            }
          # Windows x86_64 needs -Dasm=false because third_party/fiat/asm/
          # fiat_p256_adx_{mul,sqr}.S guards its body on (__APPLE__ || __ELF__)
          # — neither holds on COFF/PE, so the asm files are empty TUs on
          # windows. The C++ callers of those symbols *do* get emitted on
          # mingw (__GNUC__ && __x86_64__ matches), and linking any executable
          # then trips on 'undefined symbol fiat_p256_adx_mul/sqr'. OPENSSL_NO_ASM
          # suppresses the callers. Static .a (prebuilt) wouldn't catch
          # this — only executable link does — so we keep it -Dasm=false
          # for both CI and prebuilt for consistency. NASM is therefore
          # unnecessary here too.
          - { os: windows-latest,   label: windows-x86_64-gnu,   target: x86_64-windows-gnu,   extra: "-Dasm=false", run_smoke: true,  use_nasm: false, run_test_all: false }
          # windows-msvc: same fiat-asm story applies (link fails for any
          # exe), and additionally Zig 0.16's bundled libcxx clashes with
          # MSVC's <typeinfo> when linking a Zig executable. Build-only.
          - { os: windows-latest,   label: windows-x86_64-msvc,  target: x86_64-windows-msvc,  extra: "-Dasm=false", run_smoke: false, use_nasm: false, run_test_all: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via zvk (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # zvk's install.sh edits the user's shell rc, which GitHub Actions
        # doesn't pick up across steps; re-publish bin dir to GITHUB_PATH.
        run: |
          curl -fsSL https://raw.githubusercontent.com/zoptia/zig-version-kit/main/install.sh | sh
          echo "$HOME/.zoptia/zig/bin" >> "$GITHUB_PATH"

      - name: Install Zig via zvk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/zoptia/zig-version-kit/main/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.zoptia\zig\bin"

      - name: Show toolchain
        run: zig version

      - name: Set up NASM (Windows x86_64)
        if: matrix.use_nasm
        uses: ilammy/setup-nasm@v1

      - name: Native build + smoke test
        if: matrix.run_smoke
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra }} test

      - name: Run BoringSSL upstream test suite
        if: matrix.run_test_all
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra }} test-all

      - name: Native build only
        if: ${{ !matrix.run_smoke }}
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra }}

  cross:
    name: cross ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: wasm32-wasi,         extra: "-Dasm=false" }
          - { target: aarch64-windows-gnu, extra: ""            }   # no ARM Windows runner yet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via zvk
        run: |
          curl -fsSL https://raw.githubusercontent.com/zoptia/zig-version-kit/main/install.sh | sh
          echo "$HOME/.zoptia/zig/bin" >> "$GITHUB_PATH"

      - name: Build only
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra }}
