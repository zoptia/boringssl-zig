name: CI

on:
  push:
    branches: [main]
  pull_request:

# Strategy: each natively-supported platform has its own runner that does
# `zig build test` (native build + native smoke run). Targets without a
# matching runner (wasm, ARM Windows) are cross-compiled on Linux as a
# build-only check.

jobs:
  native:
    name: native ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: linux-x86_64   }
          - { os: ubuntu-24.04-arm, label: linux-aarch64  }
          - { os: macos-latest,     label: macos-aarch64  }
          - { os: macos-13,         label: macos-x86_64   }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via zvk
        # zvk's install.sh edits the user's shell rc, which GitHub Actions
        # doesn't pick up across steps; re-publish bin dir to GITHUB_PATH.
        run: |
          curl -fsSL https://raw.githubusercontent.com/zoptia/zig-version-kit/main/install.sh | sh
          echo "$HOME/.zoptia/zig/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: zig version

      - name: Native build + smoke test
        run: zig build test

  cross:
    name: cross ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: wasm32-wasi,        extra: "-Dasm=false" }
          - { target: x86_64-windows-gnu, extra: "-Dasm=false" }
          - { target: aarch64-windows-gnu, extra: ""           }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via zvk
        run: |
          curl -fsSL https://raw.githubusercontent.com/zoptia/zig-version-kit/main/install.sh | sh
          echo "$HOME/.zoptia/zig/bin" >> "$GITHUB_PATH"

      - name: Build only
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra }}
