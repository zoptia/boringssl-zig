name: Sync upstream BoringSSL

on:
  schedule:
    - cron: '0 10 * * 1'  # Mondays 10:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "boringssl-sync-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Sync upstream
        id: sync
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          ./scripts/sync-upstream.sh
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.sync.outputs.branch }}
          title: "chore: sync upstream BoringSSL"
          body: |
            Automated weekly sync of `google/boringssl@main` via
            `git fetch upstream && git merge upstream/main`. CI on this
            PR validates the new upstream still builds and `zig build
            test-all` still passes.

            Merge order:
            1. Wait for CI green on this PR.
            2. Merge with the default merge commit (don't squash — we
               want upstream's commit history visible in `git log`).
            3. To ship a release, manually
               `git tag v0.$(date +%Y%m%d).0 && git push --tags`,
               which triggers `prebuilt.yml` to publish tarballs.
          delete-branch: true
