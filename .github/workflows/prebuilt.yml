name: Prebuilt release

# Triggered by pushing a `v0.*` tag. For each supported target, runs the
# build natively (or cross-compiled where no native runner exists), packages
# `lib/*.{a,lib}` + `include/openssl/*.h` into a tarball, and uploads the
# tarballs + a SHA256SUMS manifest as assets on the GitHub Release for the
# tag.
#
# Run manually via `gh workflow run prebuilt.yml -F tag=v0.YYYYMMDD.0` to
# back-fill a release.

on:
  # Manual only — auto-tag.yml will create dated tags after sync merges
  # but does NOT trigger a release. To ship prebuilt tarballs, run:
  #   gh workflow run prebuilt.yml -F tag=v0.YYYYMMDD.0
  # or use the Actions → "Prebuilt release" → "Run workflow" UI.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish prebuilt assets for (e.g. v0.20260514.0)'
        required: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `run_tests: true` means the host can natively execute the produced
          # binary, so prebuilt.yml will run BoringSSL's own ~3500 C++ tests
          # (zig build test-all) in release mode before staging the tarball.
          # If the test binary fails, the publish job is skipped — the GitHub
          # Release won't get an asset that lost a test.

          # Native runners.
          - { os: ubuntu-latest,    label: linux-x86_64,         target: x86_64-linux-gnu,     extra: "",            archive_ext: a,   run_tests: true  }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,        target: aarch64-linux-gnu,    extra: "",            archive_ext: a,   run_tests: true  }
          - { os: macos-latest,     label: macos-aarch64,        target: aarch64-macos,        extra: "",            archive_ext: a,   run_tests: true  }
          # Windows x86_64 needs NASM (use_nasm: true) for both the
          # crypto/bcm perlasm output AND the test_support ABI trampolines
          # — those only ship in NASM form for x86/x86_64 windows. With
          # NASM installed we can also drop -Dasm=false and ship a full
          # asm-accelerated build.
          - { os: windows-latest,   label: windows-x86_64-gnu,   target: x86_64-windows-gnu,   extra: "",            archive_ext: a,   run_tests: true,  use_nasm: true }
          # windows-msvc keeps run_tests=false — Zig 0.16's bundled libcxx
          # clashes with the MSVC SDK's <typeinfo> at link time. The .lib
          # itself builds fine and MSVC consumers using their own runtime
          # don't hit this.
          - { os: windows-latest,   label: windows-x86_64-msvc,  target: x86_64-windows-msvc,  extra: "",            archive_ext: lib, run_tests: false, use_nasm: true }
          # Cross-only — no native ARM Windows runner on GitHub yet (cross-
          # build from Linux works because the .S files are GAS-format).
          # MSVC ARM omitted — cross from Linux/macOS to -windows-msvc can't
          # find the SDK.
          - { os: ubuntu-latest,    label: windows-aarch64-gnu,  target: aarch64-windows-gnu,  extra: "",            archive_ext: a,   run_tests: false }
          # Cross-only — wasm32-wasi (no wasi runtime on the runner by default).
          - { os: ubuntu-latest,    label: wasm32-wasi,          target: wasm32-wasi,          extra: "-Dasm=false", archive_ext: a,   run_tests: false }
          # musl static .a — works on Alpine, embedded Linux, and as an Android
          # (Bionic) drop-in. The musl-static test binaries run fine on a
          # glibc host (kernel ABI is the same), so we test them natively
          # on whichever host arch matches the target.
          - { os: ubuntu-latest,    label: linux-musl-x86_64,    target: x86_64-linux-musl,    extra: "",            archive_ext: a,   run_tests: true  }
          - { os: ubuntu-24.04-arm, label: linux-musl-aarch64,   target: aarch64-linux-musl,   extra: "",            archive_ext: a,   run_tests: true  }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via zvk (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/zoptia/zig-version-kit/main/install.sh | sh
          echo "$HOME/.zoptia/zig/bin" >> "$GITHUB_PATH"

      - name: Install Zig via zvk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/zoptia/zig-version-kit/main/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.zoptia\zig\bin"

      - name: Show toolchain
        run: zig version

      - name: Set up NASM (Windows x86_64)
        if: matrix.use_nasm
        uses: ilammy/setup-nasm@v1

      - name: Build (release)
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra }} -Doptimize=ReleaseFast

      - name: Run BoringSSL upstream test suite (release)
        # Only when the host can natively execute the produced binary.
        # Failure here skips the publish job — broken artifacts never
        # land on a release.
        if: matrix.run_tests
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.extra }} -Doptimize=ReleaseFast test-all

      - name: Stage tarball contents
        # Use git-bash on Windows so the same shell snippet works everywhere.
        # `shasum` doesn't exist on Windows runners, so the SHA256 line is
        # computed with python (always available) in the form
        # `<hash>  <filename>` so it concatenates cleanly into SHA256SUMS.
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="boringssl-${RELEASE_TAG}-${{ matrix.label }}"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          cp zig-out/lib/* "$STAGE/lib/"
          cp -R zig-out/include/openssl "$STAGE/include/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          python -c "import hashlib,sys; f=sys.argv[1]; h=hashlib.sha256(open(f,'rb').read()).hexdigest(); print(f'{h}  {f}')" \
            "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          ls -l "${STAGE}.tar.gz" "${STAGE}.tar.gz.sha256"

      - name: Upload artifact for collect job
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.label }}
          path: |
            boringssl-${{ env.RELEASE_TAG }}-${{ matrix.label }}.tar.gz
            boringssl-${{ env.RELEASE_TAG }}-${{ matrix.label }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all tarballs
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euxo pipefail
          cd assets
          # Combine the per-tarball .sha256 files into one SHA256SUMS document.
          # Each per-tarball file already has the form `<hash>  <filename>`.
          cat *.tar.gz.sha256 | sort > SHA256SUMS
          rm -f *.tar.gz.sha256
          ls -lh

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          cd assets
          # Create the release if the tag push path bypassed the UI; ignore if
          # it already exists. Then attach all assets (clobber if rerun).
          gh release create "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.RELEASE_TAG }}" \
            --notes "Prebuilt BoringSSL static libs for ${{ env.RELEASE_TAG }}. See README-zig.md for usage." \
            --verify-tag \
            || true
          gh release upload "${{ env.RELEASE_TAG }}" *.tar.gz SHA256SUMS \
            --repo "${{ github.repository }}" --clobber
