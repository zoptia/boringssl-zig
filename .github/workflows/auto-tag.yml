name: Auto-tag after upstream sync merge

# When a sync-upstream PR (named `sync/upstream-YYYYMMDD`) gets merged into
# main, drop a `v0.YYYYMMDD.0` tag on the resulting merge commit. The tag
# does NOT trigger a release — that stays manual via
# `gh workflow run prebuilt.yml -F tag=v0.YYYYMMDD.0` or the Actions UI.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'sync/upstream-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "boringssl-sync-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Create dated tag
        run: |
          set -euxo pipefail
          DATE=$(date -u +%Y%m%d)
          BASE="v0.${DATE}"
          PATCH=0
          # Bump patch if today already has a tag (e.g. two sync merges in
          # the same UTC day — rare but possible).
          while git rev-parse --verify "${BASE}.${PATCH}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done
          TAG="${BASE}.${PATCH}"

          git tag -a "$TAG" -m "Auto-tag after upstream sync merge of #${{ github.event.pull_request.number }}"
          git push origin "$TAG"

          echo "Created tag: $TAG"
          echo
          echo "To publish prebuilt artifacts for this tag, run:"
          echo "  gh workflow run prebuilt.yml -F tag=$TAG --repo \${{ github.repository }}"
